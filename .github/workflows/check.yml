name: VPN Gate Node Check

on:
  # 定时检测: 默认每 30 分钟一次。改成每 60 分钟: cron: "0 * * * *"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: "https://check.mars1024.com/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Sync hosts.txt to Cloudflare KV (panel ADD.txt)
        run: |
          resp=$(curl -sS --max-time 30 --retry 3 --retry-all-errors -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE}/values/ADD.txt" \
            -H "Authorization: Bearer ${CLOUDFLARE_KV_TOKEN}" \
            -H "Content-Type: text/plain" \
            --data-binary @public/hosts.txt)
          echo "$resp" | grep -q '"success":true' || { echo "KV sync failed: $resp"; exit 1; }
          echo "KV ADD.txt synced ($(wc -l < public/hosts.txt) lines)"
        env:
          CF_ACCOUNT_ID: "fdf04aa318f8fe6b7f73f8f64ec1e731"
          CF_KV_NAMESPACE: "ee3fdad1613643f582667b3082413c06"
          CLOUDFLARE_KV_TOKEN: ${{ secrets.CLOUDFLARE_KV_TOKEN }}

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://bgy8023.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'